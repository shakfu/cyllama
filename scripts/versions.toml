# Upstream git tags cyllama builds against.
# Read by scripts/manage.py and scripts/release_notes.py.

llama_cpp = "b12359"  # same commit as v1.0.0
whisper_cpp = "v1.9.5"
stable_diffusion_cpp = "master-1094-3bad892"
sqlite_vector = "1.2.0"

# The commit each tag above must resolve to. A tag can be moved; manage.py
# refuses a checkout whose HEAD differs. Update both lines together:
#   git ls-remote https://github.com/<repo> 'refs/tags/<tag>^{}' 'refs/tags/<tag>'
# (the ^{} line, when present, is the commit of an annotated tag).
[commits]
