name: build-gpu-wheels-abi3

# Release build for the GPU wheels. Produces one wheel per
# (backend x platform) tagged cp312-abi3, importable on CPython 3.12+.
# Builds with CYLLAMA_ABI3=ON (see docs/dev/abi3.md).
#
# This file is a dispatcher: each backend's build lives in its own
# `_gpu-build-<backend>.yml` reusable workflow and the wheel verification
# in `_gpu-smoke.yml`. Toolchain setup, cibuildwheel environment, and
# cache keys belong to the backend file; the trigger, the per-backend
# opt-out, and the release belong here. Each backend's cache key hashes
# its own file, so editing one backend no longer busts the other six.
#
# Triggers:
#   push of a bare-semver tag (0.4.7)  -> build every backend, then
#     publish the GitHub release for that tag. link_mode is 'dynamic'.
#   workflow_dispatch against a tag    -> build with per-backend opt-out;
#     publishes (or republishes) the release only if `upload_release`
#     is ticked
#   workflow_dispatch against a branch -> build only; `upload_release`
#     is ignored
#
# Release mode is `github.ref_type == 'tag'`, so the tag always comes from
# the ref being built. Deriving it from pyproject.toml instead would let
# `gh release create` invent a tag that does not exist, pointing at the
# default branch.
#
# The CPU/Metal wheels attach to the same release from
# build-cibw-abi3.yml; both use softprops/action-gh-release, which creates
# the release once and updates it thereafter, so either order works and
# either can be re-run alone. PyPI uploads stay dispatch-only.

permissions:
  contents: read

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:
    inputs:
      link_mode:
        description: 'Linking mode'
        required: true
        default: 'dynamic'
        type: choice
        options:
          - dynamic
          - static
      cuda_linux:
        description: 'Build CUDA wheels'
        required: false
        default: true
        type: boolean
      rocm_linux:
        description: 'Build ROCm wheels'
        required: false
        default: true
        type: boolean
      sycl_linux:
        description: 'Build SYCL wheels'
        required: false
        default: true
        type: boolean
      vulkan_linux:
        description: 'Build Vulkan wheels (Linux x86_64)'
        required: false
        default: true
        type: boolean
      cuda_windows:
        description: 'Build CUDA 12.4 Windows (x86_64)'
        required: false
        default: true
        type: boolean
      vulkan_windows:
        description: 'Build Vulkan Windows (x86_64)'
        required: false
        default: true
        type: boolean
      vulkan_macos_intel:
        description: 'Build Vulkan macOS Intel (x86_64)'
        required: false
        default: true
        type: boolean
      upload_release:
        description: 'Publish the GitHub release (tag refs only)'
        required: false
        default: false
        type: boolean
      publish_to_pypi:
        description: 'Publish wheels to PyPI'
        required: false
        default: false
        type: boolean


concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ (inputs.link_mode || 'dynamic') }}
  # A tag build publishes the release; a second run on the tag queues instead of cancelling it.
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  verify_tag:
    name: Verify release tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - if: github.ref_type == 'tag'
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version=$(python3 -c "
          import re
          text = open('pyproject.toml').read()
          print(re.search(r'^version\s*=\s*\"([^\"]+)\"', text, re.M).group(1))
          ")
          if [ "$TAG" != "$version" ]; then
            echo "::error::tag $TAG does not match pyproject.toml version $version"
            exit 1
          fi
          echo "tag $TAG matches pyproject.toml"

  # ---------------------------------------------------------------------------
  # One reusable workflow per backend. Each owns its toolchain setup, its
  # cibuildwheel environment, and its own cache keys; this file owns only
  # the trigger, the per-backend opt-out, and the release.
  # ---------------------------------------------------------------------------
  cuda:
    needs: verify_tag
    if: github.event_name != 'workflow_dispatch' || inputs.cuda_linux
    uses: ./.github/workflows/_gpu-build-cuda.yml
    with:
      link_mode: ${{ inputs.link_mode || 'dynamic' }}

  rocm:
    needs: verify_tag
    if: github.event_name != 'workflow_dispatch' || inputs.rocm_linux
    uses: ./.github/workflows/_gpu-build-rocm.yml
    with:
      link_mode: ${{ inputs.link_mode || 'dynamic' }}

  sycl:
    needs: verify_tag
    if: github.event_name != 'workflow_dispatch' || inputs.sycl_linux
    uses: ./.github/workflows/_gpu-build-sycl.yml
    with:
      link_mode: ${{ inputs.link_mode || 'dynamic' }}

  vulkan_linux:
    needs: verify_tag
    if: github.event_name != 'workflow_dispatch' || inputs.vulkan_linux
    uses: ./.github/workflows/_gpu-build-vulkan-linux.yml
    with:
      link_mode: ${{ inputs.link_mode || 'dynamic' }}

  cuda_windows:
    needs: verify_tag
    if: github.event_name != 'workflow_dispatch' || inputs.cuda_windows
    uses: ./.github/workflows/_gpu-build-cuda-windows.yml
    with:
      link_mode: ${{ inputs.link_mode || 'dynamic' }}

  vulkan_windows:
    needs: verify_tag
    if: github.event_name != 'workflow_dispatch' || inputs.vulkan_windows
    uses: ./.github/workflows/_gpu-build-vulkan-windows.yml
    with:
      link_mode: ${{ inputs.link_mode || 'dynamic' }}

  vulkan_macos_intel:
    needs: verify_tag
    if: github.event_name != 'workflow_dispatch' || inputs.vulkan_macos_intel
    uses: ./.github/workflows/_gpu-build-vulkan-macos-intel.yml
    with:
      link_mode: ${{ inputs.link_mode || 'dynamic' }}

  # ---------------------------------------------------------------------------
  # Verify each wheel installs, imports, and is genuinely abi3-tagged.
  # ---------------------------------------------------------------------------
  smoke_test:
    needs: [cuda, rocm, sycl, vulkan_linux, cuda_windows, vulkan_windows, vulkan_macos_intel]
    if: always() && !cancelled() && (needs.cuda.result == 'success' || needs.rocm.result == 'success' || needs.sycl.result == 'success' || needs.vulkan_linux.result == 'success' || needs.cuda_windows.result == 'success' || needs.vulkan_windows.result == 'success' || needs.vulkan_macos_intel.result == 'success')
    uses: ./.github/workflows/_gpu-smoke.yml
    with:
      cuda_linux: ${{ needs.cuda.result == 'success' }}
      rocm_linux: ${{ needs.rocm.result == 'success' }}
      sycl_linux: ${{ needs.sycl.result == 'success' }}
      vulkan_linux: ${{ needs.vulkan_linux.result == 'success' }}
      cuda_windows: ${{ needs.cuda_windows.result == 'success' }}
      vulkan_windows: ${{ needs.vulkan_windows.result == 'success' }}
      vulkan_macos_intel: ${{ needs.vulkan_macos_intel.result == 'success' }}

  collect:
    name: Collect abi3 GPU wheels
    needs: [cuda, rocm, sycl, vulkan_linux, cuda_windows, vulkan_windows, vulkan_macos_intel]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Download all wheel artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: wheels-abi3-*

      - name: Collect into single directory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          find artifacts -name "*.whl" -exec cp {} dist/ \;
          shopt -s nullglob
          wheels=(dist/*.whl)
          # The job runs under always(), so without this an all-builds-failed
          # run would still report success and publish an empty release.
          if [ ${#wheels[@]} -eq 0 ]; then
            echo "::error::no wheels were built"
            exit 1
          fi
          echo "=== Collected abi3 GPU wheels ==="
          ls -lh dist/

      - name: Upload collected wheels
        uses: actions/upload-artifact@v7
        with:
          name: gpu-wheels-abi3-all
          path: dist/*.whl
          if-no-files-found: error

  publish:
    name: Publish to GitHub Release
    needs: [verify_tag, collect, smoke_test]
    # !cancelled() is needed because individual backends may be skipped,
    # which would otherwise skip this job too. The remaining clauses put
    # back the gating that override removes. A backend whose build failed
    # is absent from the release; any failed smoke test blocks the whole
    # release, since collect cannot drop one backend's wheels.
    # Static wheels share the dynamic wheels' filenames, so only dynamic
    # builds publish; `--clobber` would otherwise replace the release assets.
    if: >-
      github.ref_type == 'tag'
      && (github.event_name == 'push' || inputs.upload_release)
      && (inputs.link_mode || 'dynamic') == 'dynamic'
      && !cancelled()
      && needs.verify_tag.result == 'success'
      && needs.collect.result == 'success'
      && needs.smoke_test.result != 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - name: Download collected wheels
        uses: actions/download-artifact@v8
        with:
          name: gpu-wheels-abi3-all
          path: dist

      - name: List wheels
        run: ls -lh dist/

      - name: Extract release notes from CHANGELOG
        id: notes
        # release_notes.py exits 2 and writes nothing when neither
        # `## [<tag>]` nor `## [Unreleased]` is present. A release without
        # hand-written notes beats a failed release, so fall back to
        # GitHub's generated ones.
        run: |
          if python3 scripts/release_notes.py "$TAG" --output release-notes.md; then
            echo "found=1" >> "$GITHUB_OUTPUT"
            cat release-notes.md
          else
            echo "found=0" >> "$GITHUB_OUTPUT"
            echo "::warning::no CHANGELOG section for $TAG; using generated notes"
          fi

      # Creates the release on first run and updates it thereafter, so the
      # CPU and GPU workflows can both publish to one tag in either order.
      # A new release is a prerelease: this leg runs up to 2h behind the CPU one, so
      # promoting on the first leg to finish would advertise a "Latest"
      # release carrying only half the wheels. Promotion is manual:
      # `gh release edit <tag> --prerelease=false`.
      # A re-run must not demote a release that was promoted by hand.
      - name: Read existing prerelease state
        id: existing
        run: |
          if state=$(gh release view "$TAG" --json isPrerelease --jq .isPrerelease 2>err.txt); then
            echo "prerelease=$state" >> "$GITHUB_OUTPUT"
          elif grep -q "release not found" err.txt; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            cat err.txt >&2
            exit 1
          fi

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ env.TAG }}
          name: cyllama ${{ env.TAG }}
          body_path: ${{ steps.notes.outputs.found == '1' && 'release-notes.md' || '' }}
          generate_release_notes: ${{ steps.notes.outputs.found != '1' }}
          prerelease: ${{ steps.existing.outputs.prerelease != 'false' }}

      - name: Upload wheels
        # --clobber so re-running one workflow tops the release up instead
        # of failing on the assets already attached by the other.
        run: gh release upload "$TAG" dist/*.whl --clobber

  publish_to_pypi:
    name: Publish abi3 wheels to PyPI
    needs: [collect, smoke_test]
    if: inputs.publish_to_pypi && always() && !cancelled() && needs.collect.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: pypi
    steps:
      - name: Download collected wheels
        uses: actions/download-artifact@v8
        with:
          name: gpu-wheels-abi3-all
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true
