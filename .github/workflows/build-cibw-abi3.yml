name: build-cibw-abi3

# Release build for the CPU/Metal wheels. Produces one wheel per platform
# tagged cp312-abi3-<plat>, importable on CPython 3.12+.
#
# Builds with CYLLAMA_ABI3=ON (see docs/dev/abi3.md).
#
# Triggers:
#   push of a bare-semver tag (0.4.7)  -> build, smoke test, publish the
#     GitHub release for that tag
#   workflow_dispatch against a tag    -> build + smoke test; publishes
#     (or republishes) the release only if `upload_release` is ticked
#   workflow_dispatch against a branch -> build + smoke test only;
#     `upload_release` is ignored
#   pull_request touching native/build files -> Linux-only build + smoke
#     test, to catch binding and build breaks before release day
#
# Release mode is `github.ref_type == 'tag'`, so the tag always comes from
# the ref being built. Deriving it from pyproject.toml instead would let
# `gh release create` invent a tag that does not exist, pointing at the
# default branch.
#
# Publishing needs every build leg and the full cross-version smoke
# matrix, so one failure ships nothing. The GPU wheels attach to the same
# release from build-gpu-wheels-abi3.yml; both use
# softprops/action-gh-release, which creates the release once and updates
# it thereafter, so either order works and either can be re-run alone.
# PyPI uploads stay dispatch-only.

permissions:
  contents: read

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+*'
  pull_request:
    paths:
      - 'src/cyllama/**/*.pyx'
      - 'src/cyllama/**/*.pxd'
      - 'src/cyllama/**/*.pxi'
      - 'src/cyllama/**/*.c'
      - 'src/cyllama/**/*.cpp'
      - 'src/cyllama/**/*.h'
      - 'CMakeLists.txt'
      - 'scripts/cmake/**'
      - 'scripts/patches/**'
      - 'scripts/manage.py'
      - 'pyproject.toml'
      - '.github/workflows/build-cibw-abi3.yml'
  workflow_dispatch:
    inputs:
      upload_release:
        description: 'Publish the GitHub release (tag refs only)'
        required: false
        default: false
        type: boolean
      publish_to_pypi:
        description: 'Publish wheels to PyPI'
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A tag build publishes the release; a second run on the tag queues instead of cancelling it.
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  # A tag naming a different version than pyproject.toml would produce a
  # release called 0.4.7 whose assets are all cyllama-0.4.6-*.whl, and no
  # re-run fixes that -- it needs a new tag. Catch it in a minute rather
  # than after a two-hour build. No-op for branch builds.
  verify_tag:
    name: Verify release tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - if: github.ref_type == 'tag'
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version=$(python3 -c "
          import re
          text = open('pyproject.toml').read()
          print(re.search(r'^version\s*=\s*\"([^\"]+)\"', text, re.M).group(1))
          ")
          if [ "$TAG" != "$version" ]; then
            echo "::error::tag $TAG does not match pyproject.toml version $version"
            exit 1
          fi
          echo "tag $TAG matches pyproject.toml"

  build_wheels:
    name: Build abi3 wheels for ${{ matrix.os }}
    needs: verify_tag
    # runs-on is a lookup, not a matrix `include`: an include naming an os
    # that the PR filter removed would add that job back.
    runs-on: ${{ fromJSON('{"linux-intel":"ubuntu-latest","windows-intel":"windows-latest","macos-intel":"macos-15-intel","macos-arm":"macos-latest"}')[matrix.os] }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: ${{ github.event_name == 'pull_request' && fromJSON('["linux-intel"]') || fromJSON('["linux-intel","windows-intel","macos-intel","macos-arm"]') }}

    steps:
      - uses: actions/checkout@v7

      # The Linux in-container test runs with CYLLAMA_REQUIRE_MODELS=1, so the
      # model must be in the project dir that cibuildwheel copies to /project.
      - name: Cache test model
        if: runner.os == 'Linux'
        id: cache-model
        uses: actions/cache@v5
        with:
          path: models/Llama-3.2-1B-Instruct-Q8_0.gguf
          key: test-model-llama-3.2-1b-q8-432f310a

      - name: Download test model
        if: runner.os == 'Linux' && steps.cache-model.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p models
          curl -fsSL --retry 3 --retry-all-errors --retry-delay 2 https://huggingface.co/bartowski/Llama-3.2-1B-Instruct-GGUF/resolve/067b946cf014b7c697f3654f621d577a3e3afd1c/Llama-3.2-1B-Instruct-Q8_0.gguf \
            -o models/Llama-3.2-1B-Instruct-Q8_0.gguf
          echo "432f310a77f4650a88d0fd59ecdd7cebed8d684bafea53cbff0473542964f0c3  models/Llama-3.2-1B-Instruct-Q8_0.gguf" | (sha256sum -c - || shasum -a 256 -c -)

      - name: Cache thirdparty deps
        id: cache-deps
        uses: actions/cache@v5
        with:
          path: thirdparty/
          key: deps-abi3-${{ matrix.os }}-${{ hashFiles('scripts/manage.py', 'pyproject.toml', '.github/workflows/build-cibw-abi3.yml') }}

      - name: Set CCACHE_DIR to workspace
        if: runner.os != 'Windows'
        shell: bash
        run: echo "CCACHE_DIR=${{ github.workspace }}/.ccache" >> "$GITHUB_ENV"

      - name: ccache
        if: runner.os != 'Windows'
        uses: hendrikmuhs/ccache-action@5ebbd400eff9e74630f759d94ddd7b6c26299639 # v1.2
        with:
          key: ccache-abi3-${{ matrix.os }}
          evict-old-files: 1d

      - name: Build abi3 wheels
        uses: pypa/cibuildwheel@v4.2.0
        env:
          CIBW_PLATFORM: auto
          CIBW_ARCHS: auto
          # Single build per platform - the resulting wheel is tagged
          # cp312-abi3 and is valid on 3.12+. Floor is 3.12 because
          # Cython uses vectorcall (limited-API since 3.12) for faster
          # call paths. 3.11 would work but misses that perf win; 3.10
          # fails because Py_buffer is not in the 3.10 stable ABI.
          CIBW_BUILD: "cp312-*"
          # Per-platform environment. cibuildwheel resolves
          # CIBW_ENVIRONMENT_<PLAT> independently of pyproject.toml's
          # [tool.cibuildwheel.<plat>] environment table, so each
          # platform must carry its own copy of the relevant defaults
          # from pyproject.toml AND the two abi3 opt-in vars. The
          # macOS entry is critical: without MACOSX_DEPLOYMENT_TARGET
          # the deployment target defaults to 10.9 and llama.cpp's
          # std::filesystem::path usage fails to compile (introduced
          # in macOS 10.15).
          CIBW_ENVIRONMENT_LINUX: >-
            SKBUILD_CMAKE_DEFINE="CYLLAMA_ABI3=ON"
            SKBUILD_WHEEL_PY_API=cp312
            GGML_METAL=0
            GGML_NATIVE=0
            CYLLAMA_REQUIRE_MODELS=1
            CCACHE_DIR=/project/.ccache
            CCACHE_DEPEND=1
            CMAKE_C_COMPILER_LAUNCHER=ccache
            CMAKE_CXX_COMPILER_LAUNCHER=ccache
          CIBW_ENVIRONMENT_MACOS: >-
            SKBUILD_CMAKE_DEFINE="CYLLAMA_ABI3=ON"
            SKBUILD_WHEEL_PY_API=cp312
            MACOSX_DEPLOYMENT_TARGET=11.0
            GGML_METAL=1
            GGML_NATIVE=0
            CCACHE_DIR=${{ github.workspace }}/.ccache
            CCACHE_DEPEND=1
            CMAKE_C_COMPILER_LAUNCHER=ccache
            CMAKE_CXX_COMPILER_LAUNCHER=ccache
          CIBW_ENVIRONMENT_WINDOWS: >-
            SKBUILD_CMAKE_DEFINE="CYLLAMA_ABI3=ON"
            SKBUILD_WHEEL_PY_API=cp312
            GGML_METAL=0
            GGML_NATIVE=0

      - uses: actions/upload-artifact@v7
        with:
          name: abi3-wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl

  # Verify the abi3 wheel actually imports and runs on every Python
  # version in the support range. cibuildwheel only tests on cp312
  # during build, so this cross-version matrix is the real validation.
  cross_version_smoke_test:
    name: Smoke test py${{ matrix.python }} on ${{ matrix.os }}
    needs: build_wheels
    runs-on: ${{ fromJSON('{"linux-intel":"ubuntu-latest","macos-arm":"macos-latest","windows-intel":"windows-latest"}')[matrix.os] }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: ${{ github.event_name == 'pull_request' && fromJSON('["linux-intel"]') || fromJSON('["linux-intel","macos-arm","windows-intel"]') }}
        python: ["3.12", "3.13", "3.14"]

    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true

      - name: Download abi3 wheel artifact
        uses: actions/download-artifact@v8
        with:
          name: abi3-wheels-${{ matrix.os }}
          path: wheels

      - name: Cache test model
        id: cache-model
        uses: actions/cache@v5
        with:
          path: models/Llama-3.2-1B-Instruct-Q8_0.gguf
          key: test-model-llama-3.2-1b-q8-432f310a

      - name: Download test model
        if: steps.cache-model.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p models
          curl -fsSL --retry 3 --retry-all-errors --retry-delay 2 https://huggingface.co/bartowski/Llama-3.2-1B-Instruct-GGUF/resolve/067b946cf014b7c697f3654f621d577a3e3afd1c/Llama-3.2-1B-Instruct-Q8_0.gguf \
            -o models/Llama-3.2-1B-Instruct-Q8_0.gguf
          echo "432f310a77f4650a88d0fd59ecdd7cebed8d684bafea53cbff0473542964f0c3  models/Llama-3.2-1B-Instruct-Q8_0.gguf" | (sha256sum -c - || shasum -a 256 -c -)

      - name: Find abi3 wheel
        id: find-wheel
        shell: bash
        run: |
          # Single abi3 wheel per platform - tagged cp312-abi3-<plat>.
          WHEEL=$(find wheels -name "*abi3*.whl" | head -1)
          if [ -z "$WHEEL" ]; then
            echo "ERROR: no abi3 wheel found in wheels/"
            ls -la wheels/
            exit 1
          fi
          echo "wheel=$WHEEL" >> "$GITHUB_OUTPUT"
          echo "Found abi3 wheel: $WHEEL"

      - name: Install abi3 wheel in clean venv
        shell: bash
        run: |
          python -m venv abi3-venv
          if [ "$RUNNER_OS" = "Windows" ]; then
            source abi3-venv/Scripts/activate
          else
            source abi3-venv/bin/activate
          fi
          python --version
          pip install "${{ steps.find-wheel.outputs.wheel }}"

      - name: Verify extension suffix is .abi3
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            source abi3-venv/Scripts/activate
          else
            source abi3-venv/bin/activate
          fi
          # Verify every Cython extension was built against the stable
          # ABI. Naming conventions differ by platform:
          #   Linux/macOS: abi3 -> foo.abi3.so; version-specific ->
          #                foo.cpython-3XX-<plat>.so
          #   Windows:     abi3 -> foo.pyd (no tag); version-specific ->
          #                foo.cp3XX-win_amd64.pyd
          # cyllama/rag/vector.* is excluded: it is a plain C shared
          # library (sqlite-vector) loaded by SQLite, not a CPython
          # extension, so it has no Python ABI to check.
          python -c "
          import pathlib, re, cyllama
          root = pathlib.Path(cyllama.__file__).parent
          bad = []
          # CPython extensions on macOS are .so; .dylib files are delocate-bundled C libs.
          for ext in ('*.so', '*.pyd'):
              for p in root.rglob(ext):
                  if p.parent.name == 'rag' and p.stem.split('.')[0] == 'vector':
                      continue
                  if p.suffix == '.pyd':
                      # Windows: abi3 wheels produce plain name.pyd (no
                      # soabi tag). Reject anything carrying a
                      # cp3XX-<plat> tag.
                      if re.search(r'\.cp\d+-', p.name):
                          bad.append(str(p))
                  else:
                      # Linux/macOS: abi3 wheels produce name.abi3.so
                      if '.abi3.' not in p.name:
                          bad.append(str(p))
          if bad:
              print('Non-abi3 extensions found:')
              for b in bad:
                  print(f'  {b}')
              raise SystemExit(1)
          print('All compiled Python extensions are abi3-tagged')
          "

      - name: Smoke test - imports
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            source abi3-venv/Scripts/activate
          else
            source abi3-venv/bin/activate
          fi
          python -c "
          import cyllama
          print(f'cyllama {cyllama.__version__} imported on Python', __import__('sys').version)

          from cyllama import LLM, complete, chat, AsyncLLM
          from cyllama import batch_generate, BatchGenerator
          from cyllama import estimate_gpu_layers, estimate_memory_usage
          from cyllama import GenerationConfig, Response

          from cyllama.llama import llama_cpp
          print('llama_cpp extension loaded')

          from cyllama.agents import ReActAgent, ConstrainedAgent, ContractAgent, tool
          print('agents loaded')

          from cyllama.integrations.openai_compat import OpenAICompatibleClient
          print('integrations loaded')

          try:
              from cyllama.whisper import whisper_cpp
              print('whisper_cpp extension loaded')
          except ImportError as e:
              print(f'whisper_cpp not available: {e}')

          try:
              from cyllama.sd import stable_diffusion
              print('stable_diffusion extension loaded')
          except ImportError as e:
              print(f'stable_diffusion not available: {e}')

          print('All imports passed')
          "

      - name: Smoke test - inference
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            source abi3-venv/Scripts/activate
          else
            source abi3-venv/bin/activate
          fi
          python -c "
          from cyllama import complete

          response = complete(
              'What is 2+2? Reply with just the number.',
              model_path='models/Llama-3.2-1B-Instruct-Q8_0.gguf',
              n_ctx=128,
              max_tokens=16,
              # complete() calls disable_logging() unless verbose is set, so a
              # failure inside llama.cpp (backend init, buffer allocation)
              # reaches the log as a bare Python exception with no cause. Keep
              # this on: the output is short and it is the only diagnostic
              # available when a smoke test fails on a runner we cannot attach to.
              verbose=True,
          )
          print(f'Response: {response}')
          assert len(str(response).strip()) > 0, 'Empty response from model'
          print('Inference smoke test passed')
          "

  collect_wheels:
    name: Collect all abi3 wheels
    needs: build_wheels
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Download all abi3 wheel artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: abi3-wheels-*

      - name: Collect into single directory
        run: |
          mkdir -p dist
          find artifacts -name "*.whl" -exec cp {} dist/ \;
          echo "=== Collected abi3 wheels ==="
          ls -lh dist/

      - uses: actions/upload-artifact@v7
        with:
          name: cyllama-abi3-wheels-all
          path: dist/*.whl

  publish:
    name: Publish to GitHub Release
    # Plain `if`, so the default gating applies: collect_wheels and the
    # whole cross-version smoke matrix must succeed before anything ships.
    needs: [collect_wheels, cross_version_smoke_test]
    if: github.ref_type == 'tag' && (github.event_name == 'push' || inputs.upload_release)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - name: Download collected abi3 wheels
        uses: actions/download-artifact@v8
        with:
          name: cyllama-abi3-wheels-all
          path: dist

      - name: List wheels
        run: ls -lh dist/

      - name: Extract release notes from CHANGELOG
        id: notes
        # release_notes.py exits 2 and writes nothing when neither
        # `## [<tag>]` nor `## [Unreleased]` is present. A release without
        # hand-written notes beats a failed release, so fall back to
        # GitHub's generated ones.
        run: |
          if python3 scripts/release_notes.py "$TAG" --output release-notes.md; then
            echo "found=1" >> "$GITHUB_OUTPUT"
            cat release-notes.md
          else
            echo "found=0" >> "$GITHUB_OUTPUT"
            echo "::warning::no CHANGELOG section for $TAG; using generated notes"
          fi

      # Creates the release on first run and updates it thereafter, so the
      # CPU and GPU workflows can both publish to one tag in either order.
      # A new release is a prerelease: the GPU leg runs up to 2h behind this one, so
      # promoting on the first leg to finish would advertise a "Latest"
      # release carrying only half the wheels. Promotion is manual:
      # `gh release edit <tag> --prerelease=false`.
      # A re-run must not demote a release that was promoted by hand.
      - name: Read existing prerelease state
        id: existing
        run: |
          if state=$(gh release view "$TAG" --json isPrerelease --jq .isPrerelease 2>err.txt); then
            echo "prerelease=$state" >> "$GITHUB_OUTPUT"
          elif grep -q "release not found" err.txt; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            cat err.txt >&2
            exit 1
          fi

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ env.TAG }}
          name: cyllama ${{ env.TAG }}
          body_path: ${{ steps.notes.outputs.found == '1' && 'release-notes.md' || '' }}
          generate_release_notes: ${{ steps.notes.outputs.found != '1' }}
          prerelease: ${{ steps.existing.outputs.prerelease != 'false' }}

      - name: Upload wheels
        # --clobber so re-running one workflow tops the release up instead
        # of failing on the assets already attached by the other.
        run: gh release upload "$TAG" dist/*.whl --clobber

  # ---------------------------------------------------------------------------
  # Optional: publish abi3 wheels to PyPI. Requires the PYPI_API_TOKEN repo
  # secret (account- or project-scoped). Opt-in via the publish_to_pypi input.
  # ---------------------------------------------------------------------------
  publish_to_pypi:
    name: Publish abi3 wheels to PyPI
    needs: [collect_wheels, cross_version_smoke_test]
    if: inputs.publish_to_pypi
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: pypi
    steps:
      - name: Download collected abi3 wheels
        uses: actions/download-artifact@v8
        with:
          name: cyllama-abi3-wheels-all
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true
