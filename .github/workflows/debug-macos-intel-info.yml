name: debug-macos-intel-info

# One-off diagnostic: checks that MVK_CONFIG_USE_METAL_ARGUMENT_BUFFERS=0
# stops Homebrew's MoltenVK aborting on the macos-15-intel paravirtual GPU.

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'build-gpu-wheels-abi3 run that produced the wheel'
        required: true
        default: '34679210491'

permissions:
  contents: read
  actions: read

jobs:
  info:
    runs-on: macos-15-intel
    timeout-minutes: 20
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      PYTHONUNBUFFERED: "1"
      PYTHONFAULTHANDLER: "1"
      MVK_CONFIG_USE_METAL_ARGUMENT_BUFFERS: "0"
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@v8
        with:
          name: wheels-abi3-vulkan-macos-intel-x86_64
          path: wheels
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}

      - name: Install wheel, Vulkan loader and tools
        run: |
          brew install vulkan-loader molten-vk vulkan-tools
          brew list --versions vulkan-loader molten-vk vulkan-tools
          python -m venv venv
          venv/bin/pip install wheels/*abi3*.whl

      - name: vulkaninfo (no ggml)
        continue-on-error: true
        run: vulkaninfo --summary

      - name: cyllama info
        run: venv/bin/python -m cyllama info
