name: _gpu-smoke

# Reusable workflow: installs each backend's abi3 wheel in a clean venv
# and checks that it imports, that every compiled extension carries the
# abi3 tag, and (on Windows) that every bundled ggml-*.dll loads.
# Called by build-gpu-wheels-abi3.yml. Do not invoke directly --
# `workflow_call` only.
#
# One matrix leg per backend. A leg whose build did not succeed skips
# every step rather than the job, so the matrix shape stays constant.

on:
  workflow_call:
    inputs:
      cuda_linux:
        description: 'Whether the cuda_linux wheel was built'
        type: boolean
        default: true
      rocm_linux:
        description: 'Whether the rocm_linux wheel was built'
        type: boolean
        default: true
      sycl_linux:
        description: 'Whether the sycl_linux wheel was built'
        type: boolean
        default: true
      vulkan_linux:
        description: 'Whether the vulkan_linux wheel was built'
        type: boolean
        default: true
      cuda_windows:
        description: 'Whether the cuda_windows wheel was built'
        type: boolean
        default: true
      vulkan_windows:
        description: 'Whether the vulkan_windows wheel was built'
        type: boolean
        default: true
      vulkan_macos_intel:
        description: 'Whether the vulkan_macos_intel wheel was built'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  smoke:
    name: Smoke test abi3 - ${{ matrix.backend }}
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: cuda
            runs-on: ubuntu-latest
            artifact: wheels-abi3-cuda-linux-x86_64
            condition: ${{ inputs.cuda_linux }}
          - backend: rocm
            runs-on: ubuntu-latest
            artifact: wheels-abi3-rocm-linux-x86_64
            condition: ${{ inputs.rocm_linux }}
          - backend: sycl
            runs-on: ubuntu-latest
            artifact: wheels-abi3-sycl-linux-x86_64
            condition: ${{ inputs.sycl_linux }}
          - backend: vulkan
            runs-on: ubuntu-latest
            artifact: wheels-abi3-vulkan-linux-x86_64
            condition: ${{ inputs.vulkan_linux }}
          - backend: cuda-windows
            runs-on: windows-latest
            artifact: wheels-abi3-cuda-windows-x86_64
            condition: ${{ inputs.cuda_windows }}
          - backend: vulkan-windows
            runs-on: windows-latest
            artifact: wheels-abi3-vulkan-windows-x86_64
            condition: ${{ inputs.vulkan_windows }}
          - backend: vulkan-macos-intel
            runs-on: macos-15-intel
            artifact: wheels-abi3-vulkan-macos-intel-x86_64
            condition: ${{ inputs.vulkan_macos_intel }}

    steps:
      - name: Check if backend was built
        id: check
        shell: bash
        env:
          CONDITION: ${{ matrix.condition }}
        run: |
          # Reject anything but a boolean: an unexpanded `inputs.x` once
          # skipped every leg while each reported success.
          case "$CONDITION" in
            true)  echo "skip=false" >> "$GITHUB_OUTPUT" ;;
            false) echo "skip=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::matrix.condition is '$CONDITION', expected true or false"; exit 1 ;;
          esac

      - uses: actions/setup-python@v7
        if: steps.check.outputs.skip != 'true'
        with:
          python-version: "3.12"

      - name: Download wheel artifacts
        if: steps.check.outputs.skip != 'true'
        uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.artifact }}
          path: wheels

      - name: Find abi3 wheel
        if: steps.check.outputs.skip != 'true'
        id: find-wheel
        shell: bash
        run: |
          WHEEL=$(find wheels -name "*abi3*.whl" | head -1)
          if [ -z "$WHEEL" ]; then
            echo "ERROR: no abi3 wheel found in wheels/"
            ls -la wheels/
            exit 1
          fi
          echo "wheel=$WHEEL" >> "$GITHUB_OUTPUT"
          echo "Found abi3 wheel: $WHEEL"

      - name: Install wheel in clean venv
        if: steps.check.outputs.skip != 'true'
        shell: bash
        run: |
          python -m venv smoke-venv
          if [ "$RUNNER_OS" = "Windows" ]; then
            source smoke-venv/Scripts/activate
          else
            source smoke-venv/bin/activate
          fi
          pip install "${{ steps.find-wheel.outputs.wheel }}"

      # -------------------------------------------------------------------
      # Host runtimes. GPU wheels do not vendor their vendor runtime (see
      # the per-backend excludes in scripts/manage.py), so each leg installs
      # it here, pinned to the version the wheel was built against. Only the
      # userspace libraries are needed: the runners have no GPU, and these
      # steps exist so the wheel imports and its backend libraries link.
      # vulkan-windows needs nothing: delvewheel bundles vulkan-1.dll.
      # -------------------------------------------------------------------
      - name: Install CUDA 12.4 runtime (Linux)
        if: steps.check.outputs.skip != 'true' && matrix.backend == 'cuda'
        shell: bash
        run: |
          REDIST=https://developer.download.nvidia.com/compute/cuda/redist
          CUDA="$RUNNER_TEMP/cuda"
          mkdir -p "$CUDA"
          fetch() {  # url sha256 dest
            curl -fsSL --retry 3 --retry-all-errors -o "$3" "$1"
            echo "$2  $3" | sha256sum -c -
          }
          fetch "$REDIST/cuda_cudart/linux-x86_64/cuda_cudart-linux-x86_64-12.4.127-archive.tar.xz" \
            0483bff9a36e7a44465db3cd42874f6f70f019297dcf803fbefcbf58d7448c8f "$RUNNER_TEMP/cudart.tar.xz"
          fetch "$REDIST/libcublas/linux-x86_64/libcublas-linux-x86_64-12.4.5.8-archive.tar.xz" \
            c267c4d2cd42065ae2c30ca41a43ddce4e0ecc5484de23f299e3c397b5506eda "$RUNNER_TEMP/cublas.tar.xz"
          # libcuda.so.1 belongs to the driver; cuda-compat ships it without a kernel module.
          fetch https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/x86_64/cuda-compat-12-4_550.163.01-0ubuntu1_amd64.deb \
            e80aa09b12f22238f9fa36b8793bcb7cbca9c2e152fe153de4a4588841e18551 "$RUNNER_TEMP/cuda-compat.deb"
          tar -xJf "$RUNNER_TEMP/cudart.tar.xz" -C "$CUDA"
          tar -xJf "$RUNNER_TEMP/cublas.tar.xz" -C "$CUDA"
          dpkg-deb -x "$RUNNER_TEMP/cuda-compat.deb" "$CUDA/compat"
          LIBS="$(printf '%s:' "$CUDA"/*-archive/lib)$CUDA/compat/usr/local/cuda-12.4/compat"
          echo "LD_LIBRARY_PATH=$LIBS:$LD_LIBRARY_PATH" >> "$GITHUB_ENV"

      - name: Install CUDA 12.4 runtime (Windows)
        if: steps.check.outputs.skip != 'true' && matrix.backend == 'cuda-windows'
        shell: bash
        run: |
          REDIST=https://developer.download.nvidia.com/compute/cuda/redist
          CUDA="$(cygpath -u "$RUNNER_TEMP")/cuda"
          WCUDA="$(cygpath -w "$CUDA")"  # 7z is a native exe
          mkdir -p "$CUDA"
          fetch() {  # url sha256 dest
            curl -fsSL --retry 3 --retry-all-errors -o "$3" "$1"
            echo "$2  $3" | sha256sum -c -
          }
          fetch "$REDIST/cuda_cudart/windows-x86_64/cuda_cudart-windows-x86_64-12.4.127-archive.zip" \
            6a1c32e68ee1a95ca17334691ff9ad1ffe7f352c24a083d55e4c96b8063b2bcb "$RUNNER_TEMP/cudart.zip"
          fetch "$REDIST/libcublas/windows-x86_64/libcublas-windows-x86_64-12.4.5.8-archive.zip" \
            698140f12da055a3709eee2e022fcfe7bc8edf31f30115e3f7a5c877a9491de5 "$RUNNER_TEMP/cublas.zip"
          # nvcuda.dll ships only in the driver package (551.78 is the CUDA 12.4.1 driver).
          # nvcuda64.dll imports system DLLs only, so it loads on a GPU-less runner.
          fetch https://us.download.nvidia.com/tesla/551.78/551.78-data-center-tesla-desktop-winserver-2022-dch-international.exe \
            4b635030749ecefcef34c4f39d7638be8aa4c853b4052e80029a383abf2a7132 "$RUNNER_TEMP/driver.exe"
          7z x -y -o"$WCUDA" "$RUNNER_TEMP/cudart.zip" > /dev/null
          7z x -y -o"$WCUDA" "$RUNNER_TEMP/cublas.zip" > /dev/null
          7z e -y -o"$WCUDA\\driver" "$RUNNER_TEMP/driver.exe" nvcuda64.dll -r > /dev/null
          # System32 is where the driver installs nvcuda.dll, and it is on every
          # DLL search path, including ctypes' restricted one in the link test.
          cp "$CUDA/driver/nvcuda64.dll" /c/Windows/System32/nvcuda.dll
          cp "$CUDA"/*-archive/bin/{cudart64_12,cublas64_12,cublasLt64_12}.dll /c/Windows/System32/

      - name: Install ROCm 6.3.3 runtime
        if: steps.check.outputs.skip != 'true' && matrix.backend == 'rocm'
        shell: bash
        run: |
          curl -fsSL https://repo.radeon.com/rocm/rocm.gpg.key | gpg --dearmor | sudo tee /etc/apt/keyrings/rocm.gpg > /dev/null
          echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/rocm.gpg] https://repo.radeon.com/rocm/apt/6.3.3 noble main" \
            | sudo tee /etc/apt/sources.list.d/rocm.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libnuma1 libelf1 libdrm-amdgpu1 libzstd1 zlib1g
          # A full install is ~18.5 GB, almost all GPU kernel data in hipblaslt,
          # rocblas and rocsolver. Extract only the shared libraries.
          ROCM="$RUNNER_TEMP/rocm"
          mkdir -p "$ROCM" "$RUNNER_TEMP/rocm-debs"
          cd "$RUNNER_TEMP/rocm-debs"
          apt-get download hip-runtime-amd hsa-rocr comgr rocprofiler-register hipblas hipblaslt rocblas rocsolver
          for deb in ./*.deb; do
            dpkg-deb --fsys-tarfile "$deb" | tar -x -C "$ROCM" --wildcards '*/lib/lib*.so*'
          done
          echo "LD_LIBRARY_PATH=$(printf '%s:' "$ROCM"/opt/rocm-*/lib)$LD_LIBRARY_PATH" >> "$GITHUB_ENV"

      # Pinned to the build's oneAPI 2025.3: the unversioned
      # intel-oneapi-runtime-* packages now resolve to 2026.x, which ships
      # libsycl.so.9 and cannot satisfy the wheel's libsycl.so.8.
      - name: Install oneAPI 2025.3 runtime
        if: steps.check.outputs.skip != 'true' && matrix.backend == 'sycl'
        shell: bash
        run: |
          wget -qO - https://apt.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB \
            | sudo gpg --dearmor -o /usr/share/keyrings/oneapi-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/oneapi-archive-keyring.gpg] https://apt.repos.intel.com/oneapi all main" \
            | sudo tee /etc/apt/sources.list.d/oneAPI.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            intel-oneapi-compiler-dpcpp-cpp-runtime-2025.3 \
            intel-oneapi-openmp-2025.3 \
            intel-oneapi-mkl-core-2025.3 \
            intel-oneapi-mkl-sycl-blas-2025.3
          source /opt/intel/oneapi/setvars.sh
          echo "LD_LIBRARY_PATH=$LD_LIBRARY_PATH" >> "$GITHUB_ENV"

      - name: Install Vulkan loader (Linux)
        if: steps.check.outputs.skip != 'true' && matrix.backend == 'vulkan'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libvulkan1

      # The wheel's @rpath includes /usr/local/lib, where Intel Homebrew links these.
      - name: Install Vulkan loader and MoltenVK (macOS)
        if: steps.check.outputs.skip != 'true' && matrix.backend == 'vulkan-macos-intel'
        shell: bash
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: brew install vulkan-loader molten-vk

      # -------------------------------------------------------------------
      # Windows-only: link-test every bundled ggml-*.dll using the same
      # LoadLibraryW(path, NULL, 0) semantics that ggml_backend_load()
      # uses in C. Catches the class of bug where delvewheel-bundled
      # siblings (e.g. vulkan-1-<hash>.dll) are unreachable because the
      # libs dir is not on PATH — a failure mode invisible to GPU-less
      # runners since `cyllama info` still exits 0 when a backend DLL
      # fails to load. Independent of GPU/ICD presence.
      # -------------------------------------------------------------------
      - name: Smoke test - DLL link (Windows)
        id: dll-link
        if: steps.check.outputs.skip != 'true' && runner.os == 'Windows'
        shell: bash
        run: |
          source smoke-venv/Scripts/activate
          python -c "
          import ctypes, glob, os, site, sys
          failed = []
          for sp in site.getsitepackages():
              for libs in glob.glob(os.path.join(sp, 'cyllama*.libs')):
                  for dll in sorted(glob.glob(os.path.join(libs, 'ggml-*.dll'))):
                      try:
                          ctypes.WinDLL(dll)
                      except OSError as e:
                          failed.append((dll, str(e)))
                      else:
                          print(f'OK   {dll}')
          if failed:
              for d, e in failed:
                  print(f'FAIL {d}: {e}', file=sys.stderr)
              sys.exit(1)
          "

      - name: Verify extension suffix is .abi3
        id: abi3-suffix
        if: steps.check.outputs.skip != 'true'
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            source smoke-venv/Scripts/activate
          else
            source smoke-venv/bin/activate
          fi
          python -c "
          import pathlib, re, cyllama
          root = pathlib.Path(cyllama.__file__).parent
          bad = []
          # cyllama/rag/vector.* is sqlite-vector (plain C, loaded by
          # SQLite), not a CPython extension — skip.
          # Linux/macOS: abi3 wheels tag extensions as foo.abi3.so.
          # Windows: abi3 wheels produce plain foo.pyd (no soabi tag);
          # version-specific wheels produce foo.cp3XX-win_amd64.pyd.
          # CPython extensions on macOS are .so; .dylib files are delocate-bundled C libs.
          for ext in ('*.so', '*.pyd'):
              for p in root.rglob(ext):
                  if p.parent.name == 'rag' and p.stem.split('.')[0] == 'vector':
                      continue
                  if p.suffix == '.pyd':
                      if re.search(r'\.cp\d+-', p.name):
                          bad.append(str(p))
                  else:
                      if '.abi3.' not in p.name:
                          bad.append(str(p))
          if bad:
              print('Non-abi3 extensions found:')
              for b in bad:
                  print(f'  {b}')
              raise SystemExit(1)
          print('All compiled Python extensions are abi3-tagged')
          "

      - name: Smoke test - imports
        id: imports
        if: steps.check.outputs.skip != 'true'
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            source smoke-venv/Scripts/activate
          else
            source smoke-venv/bin/activate
          fi
          python -c "
          import cyllama
          print(f'cyllama {cyllama.__version__} imported successfully')

          from cyllama import LLM, complete, chat, AsyncLLM
          from cyllama import batch_generate, BatchGenerator
          from cyllama import estimate_gpu_layers, estimate_memory_usage
          from cyllama import GenerationConfig, Response

          from cyllama.llama import llama_cpp
          print('llama_cpp extension loaded')

          from cyllama.agents import ReActAgent, ConstrainedAgent, ContractAgent, tool
          print('agents loaded')

          from cyllama.integrations.openai_compat import OpenAICompatibleClient
          print('integrations loaded')

          try:
              from cyllama.whisper import whisper_cpp
              print('whisper_cpp extension loaded')
          except ImportError as e:
              print(f'whisper_cpp not available: {e}')

          try:
              from cyllama.sd import stable_diffusion
              print('stable_diffusion extension loaded')
          except ImportError as e:
              print(f'stable_diffusion not available: {e}')

          try:
              from cyllama import _backend
              print(f'Backend: cuda={getattr(_backend, \"cuda\", False)}, '
                    f'vulkan={getattr(_backend, \"vulkan\", False)}, '
                    f'hip={getattr(_backend, \"hip\", False)}, '
                    f'sycl={getattr(_backend, \"sycl\", False)}')
          except ImportError:
              print('No _backend module')

          print('All imports passed (${{ matrix.backend }})')
          "

      - name: Smoke test - cyllama info
        id: info
        if: steps.check.outputs.skip != 'true'
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            source smoke-venv/Scripts/activate
          else
            source smoke-venv/bin/activate
          fi
          python -m cyllama info

      # -------------------------------------------------------------------
      # SYCL-only: install Intel's OpenCL CPU runtime so the SYCL dispatch
      # stack has a compliant device on a GPU-less runner, then run a
      # 1-token decode. Exercises the full pipeline (Cython wrappers ->
      # libllama -> libggml-sycl -> SYCL runtime -> OpenCL CPU device ->
      # sampler -> teardown) on free hardware. Catches ABI/symbol/teardown
      # regressions that bare imports miss. Best-effort: if the Intel
      # runtime install fails (repo mirror issue, etc.) we log and move on
      # rather than breaking the whole GPU-wheels workflow.
      # -------------------------------------------------------------------
      - name: Install Intel OpenCL CPU runtime
        if: steps.check.outputs.skip != 'true' && matrix.backend == 'sycl'
        continue-on-error: true
        timeout-minutes: 15
        run: |
          # The oneAPI apt repo was added by "Install oneAPI 2025.3 runtime".
          sudo apt-get install -y --no-install-recommends \
            intel-oneapi-runtime-opencl \
            intel-oneapi-runtime-dpcpp-cpp

      - name: Cache test model (SYCL)
        if: steps.check.outputs.skip != 'true' && matrix.backend == 'sycl'
        id: cache-model-sycl
        uses: actions/cache@v5
        with:
          path: models/Llama-3.2-1B-Instruct-Q8_0.gguf
          key: test-model-llama-3.2-1b-q8-432f310a

      - name: Download test model (SYCL)
        if: steps.check.outputs.skip != 'true' && matrix.backend == 'sycl' && steps.cache-model-sycl.outputs.cache-hit != 'true'
        run: |
          mkdir -p models
          curl -fsSL --retry 3 --retry-all-errors --retry-delay 2 https://huggingface.co/bartowski/Llama-3.2-1B-Instruct-GGUF/resolve/067b946cf014b7c697f3654f621d577a3e3afd1c/Llama-3.2-1B-Instruct-Q8_0.gguf \
            -o models/Llama-3.2-1B-Instruct-Q8_0.gguf
          echo "432f310a77f4650a88d0fd59ecdd7cebed8d684bafea53cbff0473542964f0c3  models/Llama-3.2-1B-Instruct-Q8_0.gguf" | (sha256sum -c - || shasum -a 256 -c -)

      - name: Smoke test - SYCL 1-token CPU inference
        if: steps.check.outputs.skip != 'true' && matrix.backend == 'sycl'
        continue-on-error: true
        timeout-minutes: 15
        env:
          ONEAPI_DEVICE_SELECTOR: opencl:cpu
        run: |
          source smoke-venv/bin/activate
          python -c "
          from cyllama import complete
          response = complete(
              'Hi',
              model_path='models/Llama-3.2-1B-Instruct-Q8_0.gguf',
              n_ctx=128,
              max_tokens=1,
              verbose=True,  # else llama.cpp's own error is discarded; see build-cibw-abi3.yml
          )
          print(f'SYCL CPU decode response: {response!r}')
          assert len(str(response).strip()) > 0, 'Empty response'
          print('SYCL CPU inference smoke test passed')
          "

      # Last step, so it runs only when every earlier step succeeded. Fails a
      # leg whose checks were skipped instead of run, which would otherwise
      # report success.
      - name: Require that the checks ran
        if: steps.check.outputs.skip != 'true'
        shell: bash
        env:
          ABI3_SUFFIX: ${{ steps.abi3-suffix.outcome }}
          IMPORTS: ${{ steps.imports.outcome }}
          INFO: ${{ steps.info.outcome }}
          DLL_LINK: ${{ runner.os == 'Windows' && steps.dll-link.outcome || 'success' }}
        run: |
          failed=0
          for name in ABI3_SUFFIX IMPORTS INFO DLL_LINK; do
            if [ "${!name}" != "success" ]; then
              echo "::error::check $name has outcome '${!name}', expected success"
              failed=1
            fi
          done
          exit "$failed"
