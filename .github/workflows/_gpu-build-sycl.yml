name: _gpu-build-sycl

# Reusable workflow: builds SYCL abi3 wheels for Linux x86_64.
# Called by build-gpu-wheels-abi3.yml, which owns the trigger, the
# per-backend opt-out, and the release. Do not invoke directly --
# `workflow_call` only.

on:
  workflow_call:
    inputs:
      link_mode:
        description: '"dynamic" | "static"'
        type: string
        default: dynamic

permissions:
  contents: read

env:
  CIBW_BUILD_VERBOSITY: 1
  # abi3: a single build per platform produces a cp312-abi3 wheel
  # valid for CPython 3.12+.
  CIBW_BUILD: "cp312-*"
  CIBW_SKIP: "*-musllinux_* *-win32 *-manylinux_i686"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    name: SYCL abi3 - Linux x86_64 (${{ inputs.link_mode }})
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      # workflow_call has no `choice` input type, so the value is checked
      # here. Anything but 'dynamic' falls through the ternaries below to
      # a static build, which would otherwise ship silently mislabelled.
      - name: Validate link_mode
        shell: bash
        run: |
          case "${{ inputs.link_mode }}" in
            dynamic|static) ;;
            *) echo "::error::link_mode must be 'dynamic' or 'static', got '${{ inputs.link_mode }}'"; exit 1 ;;
          esac

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Cache thirdparty deps
        id: cache-deps
        uses: actions/cache@v5
        with:
          path: thirdparty/
          key: deps-abi3-sycl-${{ inputs.link_mode }}-${{ hashFiles('scripts/manage.py', 'pyproject.toml', '.github/workflows/_gpu-build-sycl.yml') }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install cibuildwheel
        run: pip install cibuildwheel==3.4.0

      - name: Set CCACHE_DIR to workspace
        run: echo "CCACHE_DIR=${{ github.workspace }}/.ccache" >> "$GITHUB_ENV"

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ccache-abi3-sycl-${{ inputs.link_mode }}
          evict-old-files: 1d

      - name: Build SYCL abi3 wheels
        run: python -m cibuildwheel --output-dir wheelhouse
        env:
          CIBW_ARCHS_LINUX: x86_64
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
          CIBW_BEFORE_ALL_LINUX: >
            dnf install -y git epel-release &&
            dnf install -y ccache &&
            rpm --import https://yum.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB &&
            dnf config-manager --add-repo https://yum.repos.intel.com/oneapi &&
            dnf install -y intel-oneapi-dpcpp-cpp-2025.3 intel-oneapi-mkl-devel-2025.3 &&
            if [ -f /project/thirdparty/.deps-complete ]; then echo "=== Deps cached, skipping build ==="; exit 0; fi &&
            CI_PYTHON=$(ls -d /opt/python/cp3*/bin | head -1) &&
            $CI_PYTHON/pip install cmake ninja &&
            source /opt/intel/oneapi/setvars.sh &&
            export CC=icx CXX=icpx &&
            PATH=$CI_PYTHON:$PATH
            CCACHE_DIR=/project/.ccache
            CMAKE_C_COMPILER_LAUNCHER=ccache
            CMAKE_CXX_COMPILER_LAUNCHER=ccache
            GGML_NATIVE=OFF GGML_SYCL=1 GGML_METAL=0
            SD_USE_VENDORED_GGML=${{ inputs.link_mode == 'dynamic' && '0' || '1' }}
            $CI_PYTHON/python scripts/manage.py build --all --deps-only --no-sd-examples
            ${{ inputs.link_mode == 'dynamic' && '--dynamic' || '' }} &&
            touch /project/thirdparty/.deps-complete
          CIBW_BEFORE_BUILD_LINUX: >
            python {project}/scripts/ci_rename_package.py cyllama-sycl &&
            cd {project} && python scripts/manage.py write_build_config
          CIBW_ENVIRONMENT_LINUX: >
            GGML_NATIVE=OFF
            GGML_SYCL=1
            GGML_METAL=0
            CC=icx
            CXX=icpx
            PATH=/opt/intel/oneapi/compiler/latest/bin:$PATH
            LD_LIBRARY_PATH=/opt/intel/oneapi/compiler/latest/lib:/opt/intel/oneapi/mkl/latest/lib:$LD_LIBRARY_PATH
            CFLAGS=-s
            CXXFLAGS=-s
            CCACHE_DIR=/project/.ccache
            CMAKE_C_COMPILER_LAUNCHER=ccache
            CMAKE_CXX_COMPILER_LAUNCHER=ccache
            WITH_DYLIB=${{ inputs.link_mode == 'dynamic' && '1' || '0' }}
            SD_USE_VENDORED_GGML=${{ inputs.link_mode == 'dynamic' && '0' || '1' }}
            SKBUILD_CMAKE_DEFINE="CYLLAMA_ABI3=ON"
            SKBUILD_WHEEL_PY_API=cp312
          CIBW_TEST_COMMAND: ""
          CIBW_REPAIR_WHEEL_COMMAND_LINUX: >
            python {project}/scripts/manage.py wheel_repair --backend sycl --dest-dir {dest_dir} {wheel}

      - name: List built wheels
        run: ls -lah wheelhouse/

      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-abi3-sycl-linux-x86_64
          path: ./wheelhouse/*.whl
