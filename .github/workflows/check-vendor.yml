name: check-vendor

# Vendor-drift guard: verifies thirdparty/{llama.cpp,whisper.cpp,
# stable-diffusion.cpp}/include/ and thirdparty/sqlite-vector/ match the
# versions pinned in scripts/versions.toml. sqlite-vector may differ only in
# `cyllama:`-marked hunks. Catches:
#   - accidental local edits to vendored headers
#   - upstream files added under non-exact pins
#   - desynchronization between the pinned version and the committed tree
#   - a stale build/ checkout whose older headers were installed over the
#     committed tree and then committed (see AbstractBuilder.ensure_source)
#
# Pattern borrowed from llama.cpp's own check-vendor.yml.

permissions:
  contents: read

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/manage.py'
      - 'scripts/versions.toml'
      - 'thirdparty/llama.cpp/include/**'
      - 'thirdparty/whisper.cpp/include/**'
      - 'thirdparty/stable-diffusion.cpp/include/**'
      - 'thirdparty/sqlite-vector/**'
      - '.github/workflows/check-vendor.yml'
  push:
    branches: [main, dev]
    paths:
      - 'scripts/manage.py'
      - 'scripts/versions.toml'
      - 'thirdparty/llama.cpp/include/**'
      - 'thirdparty/whisper.cpp/include/**'
      - 'thirdparty/stable-diffusion.cpp/include/**'
      - 'thirdparty/sqlite-vector/**'
      - '.github/workflows/check-vendor.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Verify vendored llama.cpp / whisper.cpp / stable-diffusion.cpp headers and sqlite-vector sources
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Re-vendor and diff against committed tree
        run: python scripts/manage.py check_vendor

      - name: Fail on untracked files under vendored thirdparty/ trees
        run: |
          untracked=$(git status --porcelain \
            thirdparty/llama.cpp/include/ \
            thirdparty/whisper.cpp/include/ \
            thirdparty/stable-diffusion.cpp/include/ \
            thirdparty/sqlite-vector/ | grep '^??' || true)
          if [ -n "$untracked" ]; then
            echo "::error::Untracked files under vendored thirdparty/ trees:"
            echo "$untracked"
            exit 1
          fi
