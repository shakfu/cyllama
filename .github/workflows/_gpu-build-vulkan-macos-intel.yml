name: _gpu-build-vulkan-macos-intel

# Reusable workflow: builds Vulkan abi3 wheels for macOS Intel x86_64.
# Called by build-gpu-wheels-abi3.yml, which owns the trigger, the
# per-backend opt-out, and the release. Do not invoke directly --
# `workflow_call` only.

on:
  workflow_call:
    inputs:
      link_mode:
        description: '"dynamic" | "static"'
        type: string
        default: dynamic

permissions:
  contents: read

env:
  CIBW_BUILD_VERBOSITY: 1
  # abi3: a single build per platform produces a cp312-abi3 wheel
  # valid for CPython 3.12+.
  CIBW_BUILD: "cp312-*"
  CIBW_SKIP: "*-musllinux_* *-win32 *-manylinux_i686"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    name: Vulkan abi3 - macOS Intel x86_64 (${{ inputs.link_mode }})
    runs-on: macos-15-intel
    timeout-minutes: 240

    steps:
      # workflow_call has no `choice` input type, so the value is checked
      # here. Anything but 'dynamic' falls through the ternaries below to
      # a static build, which would otherwise ship silently mislabelled.
      - name: Validate link_mode
        shell: bash
        env:
          LINK_MODE: ${{ inputs.link_mode }}
        run: |
          case "$LINK_MODE" in
            dynamic|static) ;;
            *) echo "::error::link_mode must be 'dynamic' or 'static', got '$LINK_MODE'"; exit 1 ;;
          esac

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Cache thirdparty deps
        id: cache-deps
        uses: actions/cache@v5
        with:
          path: thirdparty/
          key: deps-abi3-vulkan-macos-intel-${{ inputs.link_mode }}-${{ hashFiles('scripts/manage.py', '.github/workflows/_gpu-build-vulkan-macos-intel.yml') }}

      - name: Install Vulkan SDK
        run: |
          brew install vulkan-headers vulkan-loader molten-vk shaderc spirv-headers
          SHADERC_BIN="$(brew --prefix shaderc)/bin"
          VULKAN_PREFIX="$(brew --prefix vulkan-loader)"
          echo "PATH=${SHADERC_BIN}:${PATH}" >> "$GITHUB_ENV"
          echo "VULKAN_SDK=${VULKAN_PREFIX}" >> "$GITHUB_ENV"
          echo "CMAKE_PREFIX_PATH=$(brew --prefix vulkan-headers):$(brew --prefix vulkan-loader):$(brew --prefix molten-vk):$(brew --prefix spirv-headers)" >> "$GITHUB_ENV"
          ${SHADERC_BIN}/glslc --version

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install cibuildwheel
        run: pip install cibuildwheel==3.4.0

      - name: ccache
        uses: hendrikmuhs/ccache-action@5ebbd400eff9e74630f759d94ddd7b6c26299639 # v1.2
        with:
          key: ccache-abi3-vulkan-macos-intel-${{ inputs.link_mode }}
          evict-old-files: 1d

      - name: Build Vulkan abi3 wheels
        run: python -m cibuildwheel --output-dir wheelhouse
        env:
          CIBW_ARCHS_MACOS: x86_64
          CIBW_BEFORE_BUILD_MACOS: >
            pip install delocate wheel &&
            python {project}/scripts/ci_rename_package.py cyllama-vulkan &&
            cd {project} &&
            python scripts/manage.py build --all --deps-only --no-sd-examples
            ${{ inputs.link_mode == 'dynamic' && '--dynamic' || '' }} &&
            python scripts/manage.py write_build_config
          CIBW_ENVIRONMENT_MACOS: >
            MACOSX_DEPLOYMENT_TARGET=11.0
            GGML_VULKAN=1
            GGML_METAL=0
            GGML_NATIVE=OFF
            CMAKE_C_COMPILER_LAUNCHER=ccache
            CMAKE_CXX_COMPILER_LAUNCHER=ccache
            WITH_DYLIB=${{ inputs.link_mode == 'dynamic' && '1' || '0' }}
            SD_USE_VENDORED_GGML=${{ inputs.link_mode == 'dynamic' && '0' || '1' }}
            SKBUILD_CMAKE_DEFINE="CYLLAMA_ABI3=ON"
            SKBUILD_WHEEL_PY_API=cp312
          CIBW_TEST_COMMAND: ""
          CIBW_REPAIR_WHEEL_COMMAND_MACOS: >
            python {project}/scripts/manage.py wheel_repair --backend vulkan --archs {delocate_archs} --dest-dir {dest_dir} {wheel}

      - name: List built wheels
        run: ls -lah wheelhouse/

      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-abi3-vulkan-macos-intel-x86_64
          path: ./wheelhouse/*.whl
